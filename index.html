<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>2FA Vault — Zero-Knowledge Authenticator</title>
    <meta name="description" content="2FA Vault is a self-hosted, zero-knowledge two-factor authenticator. Encrypted TOTP/HOTP codes organized in groups, with live camera QR scanning." />
    <meta name="author" content="2FA Vault" />
    <meta name="theme-color" content="#080c14" />

    <!-- Icons & installability -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Standalone / fullscreen on mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="2FA Vault" />

    <!-- Sharing previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="2FA Vault — Zero-Knowledge Authenticator" />
    <meta property="og:description" content="Self-hosted encrypted vault for your two-factor codes. TOTP/HOTP, groups, live QR scanning." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="2FA Vault — Zero-Knowledge Authenticator" />
    <meta name="twitter:description" content="Self-hosted encrypted vault for your two-factor codes. TOTP/HOTP, groups, live QR scanning." />

    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Security headers (nosniff, Permissions-Policy with camera=(self) for the
         QR scanner, CSP) are only honoured as HTTP response headers, so they are
         set in server/index.js and vercel.json rather than via <meta>. -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>2FA Vault needs JavaScript enabled to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
